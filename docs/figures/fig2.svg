<svg viewBox="0 0 680 226" role="img" aria-label="同一次滑落的三種處理方式" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: "Times New Roman", "Liberation Serif", "DFKai-SB", "標楷體", "AR PL UKai TW", serif; fill: #000; }
  .t  { font-size: 12px; }
  .tb { font-size: 12.5px; font-weight: bold; }
  .ts { font-size: 10.5px; fill: #333 !important; }
  .tm { font-family: Consolas, "DejaVu Sans Mono", monospace !important; font-size: 10px; fill: #1f4e9c !important; }
  .mid { text-anchor: middle; } .end { text-anchor: end; }
  .proc { fill: #e8f0fb; stroke: #3b6fb5; stroke-width: 1.3; }
  .io   { fill: #e4f4e1; stroke: #4a9a4a; stroke-width: 1.3; }
  .dec  { fill: #fdf4d3; stroke: #c9a227; stroke-width: 1.3; }
  .err  { fill: #fbe4e4; stroke: #c94444; stroke-width: 1.3; }
  .ext  { fill: #f4f4f4; stroke: #666; stroke-width: 1.3; stroke-dasharray: 5 3; }
  .main { fill: #d3e3fa; stroke: #1f4e9c; stroke-width: 2.2; }
  .fn   { fill: #fff; stroke: #3b6fb5; stroke-width: 1.3; stroke-dasharray: 5 3; }
  .wire { fill: none; stroke: #333; stroke-width: 1.2; }
</style>
<rect x="0" y="0" width="680" height="226" fill="#fff"/>
  <g class="ts">
    <path d="M150 196H660" stroke="#333" stroke-width="1" fill="none"/>
    <g stroke="#333" stroke-width="1">
      <path d="M150 196v4"/><path d="M206 196v4"/><path d="M262 196v4"/><path d="M318 196v4"/><path d="M374 196v4"/>
      <path d="M430 196v4"/><path d="M486 196v4"/><path d="M542 196v4"/><path d="M598 196v4"/><path d="M654 196v4"/>
    </g>
    <text class="ts mid" x="150" y="213">0</text><text class="ts mid" x="206" y="213">1</text><text class="ts mid" x="262" y="213">2</text>
    <text class="ts mid" x="318" y="213">3</text><text class="ts mid" x="374" y="213">4</text><text class="ts mid" x="430" y="213">5</text>
    <text class="ts mid" x="486" y="213">6</text><text class="ts mid" x="542" y="213">7</text><text class="ts mid" x="598" y="213">8</text>
    <text class="ts mid" x="654" y="213">9 秒</text>
  </g>
  <path d="M166.8 22V196" stroke="#c94444" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
  <text class="ts" x="171" y="20" style="fill:#c94444 !important">0.3 秒：滑落</text>

  <text class="tb" x="10" y="48">現況</text>
  <text class="ts" x="10" y="63">SwiftPlan 每秒 1 次</text>
  <rect class="proc" x="150" y="34" width="16.8" height="30"/>
  <rect class="err" x="166.8" y="34" width="39.2" height="30"/>
  <rect class="ext" x="206" y="34" width="280" height="30" style="stroke-dasharray:none"/>
  <text class="ts mid" x="346" y="53">重做 pick：5.0 秒（同樣的抓法）</text>
  <rect class="proc" x="486" y="34" width="140" height="30"/>
  <text class="ts mid" x="556" y="53">up：2.5 秒</text>
  <text class="tb" x="631" y="53">8.5 秒</text>

  <text class="tb" x="10" y="104">提高取樣</text>
  <text class="ts" x="10" y="119">SwiftPlan 每秒 10 次</text>
  <rect class="proc" x="150" y="90" width="16.8" height="30"/>
  <rect class="err" x="166.8" y="90" width="5.6" height="30"/>
  <rect class="ext" x="172.4" y="90" width="280" height="30" style="stroke-dasharray:none"/>
  <text class="ts mid" x="312" y="109">重做 pick：5.0 秒（同樣的抓法）</text>
  <rect class="proc" x="452.4" y="90" width="140" height="30"/>
  <text class="ts mid" x="522" y="109">up：2.5 秒</text>
  <text class="tb" x="598" y="109">7.9 秒</text>

  <text class="tb" x="10" y="160">Rewind</text>
  <text class="ts" x="10" y="175">每秒檢查 10 次</text>
  <rect class="proc" x="150" y="146" width="16.8" height="30"/>
  <rect class="err" x="166.8" y="146" width="5.6" height="30"/>
  <rect class="io" x="172.4" y="146" width="95.2" height="30"/>
  <text class="ts mid" x="220" y="165">抓低一點重抓</text>
  <rect class="proc" x="267.6" y="146" width="140" height="30"/>
  <text class="ts mid" x="337.6" y="165">up：2.5 秒</text>
  <text class="tb" x="413" y="165">4.6 秒（預估）</text>
</svg>